site_name: Posterizarr
site_url: https://fscorrupt.github.io/posterizarr/
repo_url: https://github.com/fscorrupt/posterizarr
repo_name: fscorrupt/posterizarr
edit_uri: edit/main/docs/

exclude_docs: |
  /includes/
  /tools/

theme:
  name: material
  variant: classic
  logo: images/logo_banner.png
  favicon: images/webhook.png
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.annotate
    - content.code.copy
    - navigation.instant
    - navigation.tracking
    - navigation.footer
    - header.autohide
    - search.share
    - content.tabs.link
    - toc.follow
  palette:
    - scheme: slate
      primary: black
      accent: orange
      toggle:
        icon: material/brightness-7
        name: Switch to light mode
    - scheme: default
      primary: black
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode

extra_css:
  - extra.css

extra_javascript:
  - gallery.js

# Page navigation
nav:
  - 'Home': 'index.md'
  - 'Start Here':
    - 'First-time setup': 'getting_started.md'
    - 'Requirements': 'requirements.md'
    - 'Choose an installation method': 'installation.md'
    - 'Manual PowerShell walkthrough': 'walkthrough.md'
    - 'Run the Web UI from source': 'uiinstallation.md'
  - 'Web UI Guide':
    - 'First look and navigation': 'ui_guide.md'
    - 'Configuration': 'configuration.md'
    - 'Run Modes and Queue': 'modes.md'
    - 'Action Center': 'action_center.md'
    - 'Capabilities': 'capabilities.md'
  - 'Artwork & Builders':
    - 'Artwork showcase': 'showcase.md'
    - 'Dynamic Overlays': 'dynamic_overlays.md'
    - 'Blueprints and recipes': 'blueprints.md'
    - 'Manual asset naming': 'namingconvention.md'
    - 'Plex Image Cleanup': 'plex_image_cleanup.md'
  - 'Automation & Integrations':
    - 'Run modes, schedules and triggers': 'modes.md'
    - 'Agregarr Integration': 'agregarrintegration.md'
    - 'Jellyfin Plugin': 'jellyfin_plugin.md'
    - 'Emby Plugin': 'emby_plugin.md'
    - 'Homepage API integration': 'homepage.md'
    - 'Optional Kometa Compatibility': 'kometaintegration.md'
  - 'Reference & Troubleshooting':
    - 'Artwork search order': 'searchorder.md'
    - 'Platform & Tools': 'platformandtools.md'
    - 'Networking': 'networking.md'
    - 'FAQs and troubleshooting': 'faqs.md'
    - 'API Endpoints': 'endpoints.md'
    - 'Privacy and telemetry': 'telemetry.md'
  - 'Developer Guide':
    - 'Documentation preview workflow': 'docs_preview.md'
    - 'PowerShell Scripts': 'powershell_scripts.md'
    - 'Backend Python': 'backend_python.md'
    - 'Frontend Components': 'frontend_components.md'
    - 'LLM Architecture Guide': 'llms.md'


# Extensions
markdown_extensions:
  - attr_list
  - md_in_html
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.magiclink

# Extra features (Adapted from example)
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/fscorrupt
      name: GitHub Profile
    - icon: fontawesome/brands/discord
      link: https://discord.gg/fYyJQSGt54
      name: Discord Server
    - icon: simple/kofi
      link: https://ko-fi.com/R6R81S6SC
      name: Support on Ko-fi

