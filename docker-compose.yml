---
services:
  posterizarr:
    hostname: "posterizarr"
    container_name: "posterizarr"
    environment:
      - "TZ=Europe/Berlin"
      - "TERM=xterm"
      - "RUN_TIME=disabled"
      # OPTIONAL: This tells uvicorn to run on port 9000 inside the container
      #- APP_PORT=9000      
      # OPTIONAL: Disable UI
      #- DISABLE_UI=true   
      #- ARR_WAIT_TIME=300 # OPTIONAL: Default is 300 seconds (5 minutes). This is the time Posterizarr will wait for the media server to be ready before starting its own startup process.
    image: "ghcr.io/fscorrupt/posterizarr:latest"
    restart: "unless-stopped"
    user: "1000:1000"
    ports:
      - "8000:8000" # if you want to change the port inside container, also change APP_PORT env variable
    networks:
      - "proxy"
    volumes:
      - "/opt/appdata/posterizarr:/config:rw"
      - "/opt/appdata/posterizarr/assets:/assets:rw"
      - "/opt/appdata/posterizarr/assetsbackup:/assetsbackup:rw"
      - "/opt/appdata/posterizarr/manualassets:/manualassets:rw"
      # OPTIONAL: Scheduled Plex Image Cleanup (see docs/plex_image_cleanup.md).
      # Mount the Plex DATA directory containing Metadata, Plug-in Support and Preferences.xml.
      # - "/path/to/Plex Media Server:/plex:rw"
      # Scheduler Read Only is ON by default and forces Report Only; disable it to allow cleanup.
      # Optional :ro adds a Docker-level write block that the scheduler switch cannot override.
      # In the UI Scheduler, select Plex Image Cleanup, data path /plex, and Plex API Export.
      # API Export keeps Plex running; Local Database requires manually stopping Plex first.
      # Keep RUN_TIME=disabled when using the UI scheduler. This mount does not enable cleanup.
networks:
  proxy:
    driver: bridge
    external: true
