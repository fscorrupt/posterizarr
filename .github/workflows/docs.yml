name: Deploy Docs to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-pages-branch
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and publish production docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.13

      - name: Install documentation builder
        run: python -m pip install -r docs-requirements.txt

      - name: Generate artwork gallery
        run: python docs/tools/build_artwork_gallery.py

      - name: Build with Zensical
        run: zensical build --clean

      - name: Checkout GitHub Pages branch
        uses: actions/checkout@v6
        with:
          ref: gh-pages
          path: pages
          fetch-depth: 0

      - name: Replace production site and preserve preview
        shell: bash
        run: |
          rsync -a --delete --exclude='.git/' --exclude='/preview/' site/ pages/
          touch pages/.nojekyll
          git -C pages config user.name github-actions[bot]
          git -C pages config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C pages add -A
          if ! git -C pages diff --cached --quiet; then
            git -C pages commit -m "Deploy production docs from ${GITHUB_SHA}"
            git -C pages push origin gh-pages
          fi
