name: Discord Release Webhook

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to post (e.g. 4.0.2). Leave empty for latest release."
        required: false
        type: string
      dry_run:
        description: "Preview formatted payload in logs without posting to Discord"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  github-releases-to-discord:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Post Release Changelog to Discord
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
          DRY_RUN: ${{ inputs.dry_run }}
          DISCORD_COLOR: "2105893"
          DISCORD_USERNAME: "Release Changelog"
          DISCORD_AVATAR_URL: "https://github.com/fscorrupt/posterizarr/raw/main/docs/images/webhook.png"
          DISCORD_CONTENT: "||@Announcements||"
          DISCORD_FOOTER_TITLE: "Changelog"
          DISCORD_FOOTER_ICON_URL: "https://github.com/fscorrupt/posterizarr/raw/main/docs/images/webhook.png"
          DISCORD_FOOTER_TIMESTAMP: "true"
        run: python3 .github/scripts/discord_release_webhook.py
